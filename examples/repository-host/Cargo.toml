[package]
name = "git-zero-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Local-first compressed repository hosting experiment"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sha1 = "0.10.7"
git-zero-core = { path = "../../crates/git-zero-core", default-features = false, features = ["read"] }

[[bin]]
name = "repository-host"
path = "src/bin/repository-host.rs"

[[bin]]
name = "hosting-bench"
path = "src/bin/hosting-bench.rs"

[[bin]]
name = "hosting-cost"
path = "src/bin/hosting-cost.rs"

[lints]
workspace = true
