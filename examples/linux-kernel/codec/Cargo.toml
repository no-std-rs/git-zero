[package]
name = "git-zero-kernel-codec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
kernel = []

[dependencies]
git-zero = { path = "../../.." }
# Kernel code must never use SIMD or userspace CPU feature detection.
sha1 = { version = "0.10.7", default-features = false, features = ["force-soft"] }
embedded-tls = { version = "=0.19.0", default-features = false }
embedded-io = { version = "0.7.1", default-features = false }
rand_core = { version = "0.6", default-features = false }
# Keep TLS hashing on the scalar backend as well.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[lints]
workspace = true
