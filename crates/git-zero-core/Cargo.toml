[package]
name = "git-zero-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Allocation-free no_std Git objects, repositories, packs, zlib and delta primitives"
documentation = "https://docs.rs/git-zero-core"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-*"]

[features]
default = ["read", "write"]
read = []
write = []

[dependencies]
sha1 = { version = "0.10.7", default-features = false }
sha1-checked = { version = "0.10.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
