[package]
name = "git-zero-rustix"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bounded rustix HTTP and file storage adapters for git-zero"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE-*", "/examples/**"]

[features]
default = ["client", "server", "storage", "cli"]
client = ["git-zero/client", "rustix/net"]
server = ["git-zero/server", "git-zero/read", "rustix/net"]
storage = ["git-zero/write", "rustix/fs"]
cli = ["client", "server", "storage", "git-zero/read"]

[dependencies]
git-zero = { version = "0.1.0", path = "../..", default-features = false }
rustix = { version = "1.1.4", default-features = false }

[[bin]]
name = "git-zero"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
libc = "0.2"

[[test]]
name = "interop"
required-features = ["cli"]

[[test]]
name = "storage"
required-features = ["cli"]

[[test]]
name = "disk_cache"
required-features = ["storage"]

[[test]]
name = "snapshot"
required-features = ["cli"]

[[test]]
name = "head_states"
required-features = ["cli"]

[[test]]
name = "references"
required-features = ["cli"]

[[test]]
name = "promised"
required-features = ["cli"]

[[test]]
name = "http_framing"
required-features = ["server"]

[[test]]
name = "admission"
required-features = ["server"]

[[example]]
name = "benchmark-server"
required-features = ["cli"]

[[example]]
name = "encoder-profile"
required-features = ["cli"]

[[example]]
name = "decoder-read"
required-features = ["cli"]

[[example]]
name = "upstream-cgi"
required-features = ["cli"]

[[example]]
name = "selected-cache"
required-features = ["cli"]

[[test]]
name = "selected_http_cache"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[[test]]
name = "revision_http"
required-features = ["cli"]

[[test]]
name = "packed_http"
required-features = ["cli"]

[[test]]
name = "file_publication"
required-features = ["cli"]

[[example]]
name = "packed-dumb"
required-features = ["cli"]

[[test]]
name = "publication_socket"
required-features = ["cli"]
