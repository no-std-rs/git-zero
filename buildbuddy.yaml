actions:
  - name: "Complexity comparison"
    self_hosted: true
    pool: "linux-amd64-kvm"
    platform_properties:
      workload-isolation-type: "none"
      container-image: "none"
      resources:bazzite-host: "1"
    resource_requests: { disk: 10GB }
    timeout: 130m
    allow_concurrent_runs: false
    triggers:
      push:
        branches: ["main"]
      pull_request:
        # Compare PR branches against their actual target, including stacked PRs.
        branches: ["*"]
    steps:
      - run: |
          set -eu
          /var/lib/llm-cc/bin/llm-cc-coordinate --repository no-std-rs/git-zero --default-branch main
          python3 -I scripts/llm-cc-ratio.py "$BUILDBUDDY_ARTIFACTS_DIRECTORY"
