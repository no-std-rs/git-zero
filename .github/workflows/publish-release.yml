name: Prepare release for Runnerless

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (dispatch at this same tag)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  crates:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the tag and prepare package versions
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tests -p 'test_release*.py'
          python3 scripts/prepare-release.py "$RELEASE_TAG"
          python3 scripts/check-public-packages.py --release
          cargo test --workspace --all-features --locked
      - name: Capture verified Cargo uploads locally
        run: |
          python3 scripts/package-registry-uploads.py dist/registry
          cd dist/registry
          sha256sum --check SHA256SUMS
      - name: Attach immutable package assets for Runnerless
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/attach-release-assets.py "$RELEASE_TAG" dist/registry
