name: CI
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, riscv32imac-unknown-none-elf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Shared Rust benchmark host correctness and resource smoke test
        run: |
          cargo test -p git-zero-rustix --example benchmark-server --locked
          cargo build -p git-zero-rustix --example benchmark-server --locked
          python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
            --binary target/debug/git-zero --files 4 --blob-bytes 256 --commits 3 \
            --jobs 8 --samples 2 --warmup 1 --output /tmp/git-zero-benchmark-smoke.json
          for transfer in auto buffered; do
            python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
              --binary target/debug/git-zero --files 4 --blob-bytes 256 --commits 3 \
              --case server-clone-dumb --case server-discovery-dumb --zero-loose-cache \
              --file-transfer "$transfer" --jobs 8 --samples 2 --warmup 1 \
              --output "/tmp/git-zero-benchmark-cached-$transfer.json"
          done
          if python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
            --binary target/debug/git-zero --files 4 --blob-bytes 256 --commits 3 \
            --case server-discovery-dumb --case server-clone-dumb \
            --response-limit 64 --jobs 2 --samples 1 --warmup 0 \
            --output /tmp/git-zero-benchmark-failure.json; then
            echo "Expected clone to exceed the response budget"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/git-zero-benchmark-failure.json').read_text())
          assert report['status'] == 'failed'
          assert [result['workload'] for result in report['results']] == ['server-discovery-dumb']
          assert [error['workload'] for error in report['errors']] == ['server-clone-dumb']
          assert report['errors'][0]['message']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-${{ github.event_name }}
          path: /tmp/git-zero-benchmark-*.json
          if-no-files-found: ignore
      - run: cargo check -p git-zero --target wasm32-unknown-unknown --locked
      - run: cargo check -p git-zero --target riscv32imac-unknown-none-elf --locked

  interop:
    name: interop (${{ matrix.os }}, Git ${{ matrix.git }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        git: [system, 2.53.0]
        shard: [0/2, 1/2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install upstream Git HTTP build prerequisites
        if: matrix.git != 'system' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev zlib1g-dev
      - name: Build pinned upstream Git
        if: matrix.git != 'system'
        env:
          REFERENCE_GIT_VERSION: ${{ matrix.git }}
        run: |
          git clone --depth 1 --branch "v$REFERENCE_GIT_VERSION" https://github.com/git/git.git "$RUNNER_TEMP/git-source"
          make -C "$RUNNER_TEMP/git-source" -j "$(python3 -c 'import os; print(os.cpu_count() or 1)')" \
            prefix="$RUNNER_TEMP/reference-git" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_OPENSSL=YesPlease NO_EXPAT=YesPlease
          make -C "$RUNNER_TEMP/git-source" install \
            prefix="$RUNNER_TEMP/reference-git" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_OPENSSL=YesPlease NO_EXPAT=YesPlease
          echo "GIT_ZERO_TEST_GIT=$RUNNER_TEMP/reference-git/bin/git" >> "$GITHUB_ENV"
      - run: cargo build -p git-zero-rustix --bin git-zero --locked
      - name: Parallel Git cross-validation
        run: python3 tests/interop.py --shard '${{ matrix.shard }}' --artifacts interop-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interop-${{ strategy.job-index }}
          path: interop-artifacts
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-09
          components: rust-src
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Bounded AddressSanitizer fuzz campaigns
        run: |
          for target in packets responses routing graph; do
            mkdir -p "$RUNNER_TEMP/fuzz-corpus/$target"
            cargo fuzz run "$target" "$RUNNER_TEMP/fuzz-corpus/$target" "fuzz/corpus/$target" -- \
              -runs=5000 -max_len=4096 -timeout=5 -rss_limit_mb=512
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes-${{ github.event_name }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: cargo clippy -p git-zero-worker-wasm --target wasm32-unknown-unknown --release --locked -- -D warnings
      - run: npx wrangler deploy --dry-run --outdir /tmp/git-zero-worker-bundle
