name: CI
on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, riscv32imac-unknown-none-elf
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Isolated crate feature combinations
        env:
          RUSTFLAGS: -Dwarnings
        run: python3 scripts/check-features.py
      - name: Public package metadata and dependency order
        run: python3 scripts/check-public-packages.py
      - run: cargo test --workspace --locked
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Shared Rust benchmark host correctness and resource smoke test
        run: |
          cargo test -p git-zero-rustix --example benchmark-server --locked
          cargo build -p git-zero-rustix --example benchmark-server --example encoder-profile --example decoder-read --locked
          python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
            --binary target/debug/git-zero --decoder target/debug/examples/decoder-read --allow-unpinned-git --files 4 --blob-bytes 256 --commits 3 \
            --jobs 8 --samples 2 --warmup 1 --fixture-dir /tmp/git-zero-benchmark-fixture \
            --limits tests/benchmark-limits.json \
            --output /tmp/git-zero-benchmark-smoke.json
          python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
            --binary target/debug/git-zero --decoder target/debug/examples/decoder-read --allow-unpinned-git --files 4 --blob-bytes 256 --commits 3 \
            --zero-selection --jobs 8 --samples 2 --warmup 1 \
            --limits tests/benchmark-limits.json \
            --output /tmp/git-zero-benchmark-selected.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/git-zero-benchmark-selected.json').read_text())
          assert report['status'] == 'complete'
          assert report['zero_http_pack_policy'] == 'requested-closure'
          for result in report['results']:
              if result['workload'].startswith('server-'):
                  startup = result['server_startup']['zero']
                  assert startup['selection_enabled']
                  assert all(value > 0 for value in startup['selection_buffers'].values())
          PY
          target/debug/examples/encoder-profile /tmp/git-zero-benchmark-fixture 1
          PYTHONPATH=tests python3 - <<'PY'
          from pathlib import Path
          from interop import environment
          from test_benchmark_source import source_fixture
          root = Path('/tmp/git-zero-benchmark-source')
          root.mkdir()
          _, revision = source_fixture(root, environment())
          (root / 'revision').write_text(revision)
          PY
          python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
            --binary target/debug/git-zero --decoder target/debug/examples/decoder-read --allow-unpinned-git \
            --source-repo /tmp/git-zero-benchmark-source/source \
            --revision "$(cat /tmp/git-zero-benchmark-source/revision)" \
            --jobs 8 --samples 2 --warmup 1 \
            --limits tests/benchmark-limits.json \
            --output /tmp/git-zero-benchmark-pinned.json
          for transfer in auto buffered; do
            python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
              --binary target/debug/git-zero --allow-unpinned-git --files 4 --blob-bytes 256 --commits 3 \
              --case server-clone-dumb --case server-discovery-dumb --zero-loose-cache \
              --file-transfer "$transfer" --jobs 8 --samples 2 --warmup 1 \
              --output "/tmp/git-zero-benchmark-cached-$transfer.json"
          done
          if python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
            --binary target/debug/git-zero --allow-unpinned-git --files 4 --blob-bytes 256 --commits 3 \
            --case server-discovery-dumb --case server-clone-dumb \
            --response-limit 64 --jobs 2 --samples 1 --warmup 0 \
            --output /tmp/git-zero-benchmark-failure.json; then
            echo "Expected clone to exceed the response budget"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/git-zero-benchmark-failure.json').read_text())
          assert report['status'] == 'failed'
          assert [result['workload'] for result in report['results']] == ['server-discovery-dumb']
          assert [error['workload'] for error in report['errors']] == ['server-clone-dumb']
          assert report['errors'][0]['message']
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          limits = {'schema_version': 1, 'limits': [{
              'workload': 'server-discovery-dumb', 'implementation': 'zero',
              'metric': 'server.frontend_peak_rss_kib', 'maximum': 0}]}
          Path('/tmp/git-zero-benchmark-impossible-limits.json').write_text(json.dumps(limits))
          PY
          if python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
            --binary target/debug/git-zero --allow-unpinned-git --files 4 --blob-bytes 256 --commits 3 \
            --case server-discovery-dumb --samples 1 --warmup 0 \
            --limits /tmp/git-zero-benchmark-impossible-limits.json \
            --output /tmp/git-zero-benchmark-budget-failure.json; then
            echo "Expected RSS to exceed the deliberately impossible limit"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/git-zero-benchmark-budget-failure.json').read_text())
          assert report['schema_version'] == 3 and report['status'] == 'failed'
          assert not report['errors']
          assert report['results'][0]['samples']['zero'][0]['server']['frontend_peak_rss_kib'] > 0
          evaluation, = report['budget_evaluations']
          assert evaluation['status'] == 'exceeded' and evaluation['maximum'] == 0
          assert evaluation['observed_maximum'] > 0 and evaluation['observations'] == 1
          PY
          python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
            --binary target/debug/git-zero --allow-unpinned-git --files 4 --blob-bytes 256 --commits 3 \
            --case server-clone-smart --samples 2 --warmup 0 --rss-sample-ms 10 \
            --limits tests/benchmark-tree-limits.json \
            --output /tmp/git-zero-benchmark-tree.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/git-zero-benchmark-tree.json').read_text())
          assert report['status'] == 'complete' and report['server_rss_sampling']['enabled']
          assert report['budget_evaluations'][0]['status'] == 'passed'
          for implementation, samples in report['results'][0]['samples'].items():
              for sample in samples:
                  tree = sample['server']['process_tree_rss']
                  assert tree['samples'] >= 2 and tree['observed_peak_rss_kib'] > 0
                  assert tree['observer_cpu_s'] >= 0 and tree['max_sample_wall_s'] > 0
                  if tree['status'] == 'partial':
                      assert implementation == 'git' and tree['peak_rss_kib'] is None
                  else:
                      assert tree['status'] == 'sampled' and tree['peak_rss_kib'] > 0
          policy = {'schema_version': 1, 'limits': [{
              'workload': 'server-clone-smart', 'implementation': 'zero',
              'metric': 'server.process_tree_peak_rss_kib', 'maximum': 0}]}
          Path('/tmp/git-zero-benchmark-tree-impossible.json').write_text(json.dumps(policy))
          PY
          if python3 tests/benchmark.py --harness target/debug/examples/benchmark-server \
            --binary target/debug/git-zero --allow-unpinned-git --files 4 --blob-bytes 256 --commits 3 \
            --case server-clone-smart --samples 1 --warmup 0 --rss-sample-ms 10 \
            --limits /tmp/git-zero-benchmark-tree-impossible.json \
            --output /tmp/git-zero-benchmark-tree-failure.json; then
            echo "Expected sampled-tree RSS to exceed the deliberately impossible limit"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/git-zero-benchmark-tree-failure.json').read_text())
          assert report['status'] == 'failed' and not report['errors']
          assert report['budget_evaluations'][0]['status'] == 'exceeded'
          assert report['budget_evaluations'][0]['observed_maximum'] > 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-${{ github.event_name }}
          path: /tmp/git-zero-benchmark-*.json
          if-no-files-found: ignore
      - run: cargo check -p git-zero --target wasm32-unknown-unknown --locked
      - run: cargo check -p git-zero --target riscv32imac-unknown-none-elf --locked

  interop:
    name: interop (${{ matrix.os }}, Git ${{ matrix.git }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        git: [system, 2.53.0]
        shard: [0/2, 1/2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install upstream Git HTTP build prerequisites
        if: matrix.git != 'system' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev zlib1g-dev apache2
      - name: Build pinned upstream Git
        if: matrix.git != 'system'
        env:
          REFERENCE_GIT_VERSION: ${{ matrix.git }}
        run: |
          test "$REFERENCE_GIT_VERSION" = "$(cat tests/git-version.txt)"
          git clone --depth 1 --branch "v$REFERENCE_GIT_VERSION" https://github.com/git/git.git "$RUNNER_TEMP/git-source"
          make -C "$RUNNER_TEMP/git-source" -j "$(python3 -c 'import os; print(os.cpu_count() or 1)')" \
            prefix="$RUNNER_TEMP/reference-git" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_OPENSSL=YesPlease NO_EXPAT=YesPlease
          make -C "$RUNNER_TEMP/git-source" install \
            prefix="$RUNNER_TEMP/reference-git" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_OPENSSL=YesPlease NO_EXPAT=YesPlease
          echo "GIT_ZERO_TEST_GIT=$RUNNER_TEMP/reference-git/bin/git" >> "$GITHUB_ENV"
      - run: cargo build -p git-zero-rustix --bin git-zero --locked
      - name: Parallel Git cross-validation
        run: python3 tests/interop.py --shard '${{ matrix.shard }}' --artifacts interop-artifacts
      - name: Changing native snapshots and pack cache reuse
        run: cargo test -p git-zero-rustix --test storage real_git_fetches_changed_file_snapshots_with_cache_eviction_and_return_to_old_head --locked
      - name: Empty, unborn and detached server comparisons
        run: cargo test -p git-zero-rustix --test head_states --locked
      - name: SHA-1/SHA-256 refs, tags and selected-object server comparisons
        run: cargo test -p git-zero-rustix --test references --locked
      - name: Unchanged pinned Git smart HTTP fixtures against both CGI backends
        if: runner.os == 'Linux' && matrix.git != 'system' && matrix.shard == '0/2'
        run: |
          cargo build -p git-zero-rustix --example upstream-cgi --locked
          python3 tests/upstream_harness.py \
            --source "$RUNNER_TEMP/git-source" --git "$GIT_ZERO_TEST_GIT" \
            --native target/debug/examples/upstream-cgi \
            --apache /usr/sbin/apache2 --modules /usr/lib/apache2/modules \
            --output "$RUNNER_TEMP/upstream-fixtures"
          if python3 tests/upstream_harness.py \
            --source "$RUNNER_TEMP/git-source" --git "$GIT_ZERO_TEST_GIT" \
            --native /bin/false --apache /usr/sbin/apache2 \
            --modules /usr/lib/apache2/modules --output "$RUNNER_TEMP/upstream-fixtures-negative"; then
            echo "Expected a failed native CGI to fail the unchanged upstream cases"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'upstream-fixtures-negative'
          report = json.loads((root / 'report.json').read_text())
          assert report['status'] == 'failed' and report['errors']
          assert [row['backend'] for row in report['results']] == ['git-reference']
          assert not (root / 'sha1-v0-git-zero/cgi.jsonl').exists()
          PY
      - name: Archive upstream fixture evidence with helper symlinks intact
        if: always() && runner.os == 'Linux' && matrix.git != 'system' && matrix.shard == '0/2'
        working-directory: ${{ runner.temp }}
        run: |
          shopt -s nullglob
          fixture_dirs=(upstream-fixtures*/)
          if ((${#fixture_dirs[@]})); then
            tar -czf upstream-fixtures.tar.gz -- "${fixture_dirs[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux' && matrix.git != 'system' && matrix.shard == '0/2'
        with:
          name: upstream-fixtures-${{ github.event_name }}
          path: ${{ runner.temp }}/upstream-fixtures.tar.gz
          compression-level: 0
          if-no-files-found: ignore
      - name: Pinned Git compression, delta and decoder benchmark coverage
        if: runner.os == 'Linux' && matrix.git != 'system' && matrix.shard == '0/2'
        run: |
          cargo build -p git-zero-rustix --bin git-zero --example benchmark-server --example decoder-read --release --locked
          for profile in matched upstream-defaults; do
            python3 tests/benchmark.py --git-profile "$profile" \
              --files 16 --blob-bytes 4096 --commits 6 --samples 3 --warmup 1 \
              --output "$RUNNER_TEMP/benchmark-$profile.json"
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          reports = [json.loads((Path(os.environ['RUNNER_TEMP']) / f'benchmark-{profile}.json').read_text())
                     for profile in ('matched', 'upstream-defaults')]
          assert all(report['git_version_pin']['matches'] and report['git_version_pin']['required'] for report in reports)
          assert reports[0]['fixture']['raw_sha256'] == reports[1]['fixture']['raw_sha256']
          assert reports[0]['algorithms']['equivalent_server_features']
          assert not reports[1]['algorithms']['equivalent_server_features']
          assert reports[0]['fixture']['decoder_pack']['delta_objects'] == 0
          assert reports[1]['fixture']['decoder_pack']['delta_objects'] > 0
          assert all(len(report['results']) == 10 and report['status'] == 'complete' for report in reports)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux' && matrix.git != 'system' && matrix.shard == '0/2'
        with:
          name: benchmark-pinned-${{ github.event_name }}
          path: ${{ runner.temp }}/benchmark-*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interop-${{ strategy.job-index }}
          path: interop-artifacts
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-09
          components: rust-src
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Bounded AddressSanitizer fuzz campaigns
        run: |
          for target in packets responses routing graph inflation loose entries receive; do
            mkdir -p "$RUNNER_TEMP/fuzz-corpus/$target"
            cargo fuzz run "$target" "$RUNNER_TEMP/fuzz-corpus/$target" "fuzz/corpus/$target" -- \
              -runs=5000 -max_len=4096 -timeout=5 -rss_limit_mb=512
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes-${{ github.event_name }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: cargo clippy -p git-zero-worker-wasm --target wasm32-unknown-unknown --release --locked -- -D warnings
      - run: npx wrangler deploy --dry-run --outdir /tmp/git-zero-worker-bundle
