[package]
name = "git-zero-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
git-zero = { path = ".." }
sha1 = { version = "0.10.7", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[workspace]
members = ["."]

[[bin]]
name = "receive"
path = "fuzz_targets/receive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "loose"
path = "fuzz_targets/loose.rs"
test = false
doc = false
bench = false

[[bin]]
name = "entries"
path = "fuzz_targets/entries.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inflation"
path = "fuzz_targets/inflation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packets"
path = "fuzz_targets/packets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "responses"
path = "fuzz_targets/responses.rs"
test = false
doc = false
bench = false

[[bin]]
name = "routing"
path = "fuzz_targets/routing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph"
path = "fuzz_targets/graph.rs"
test = false
doc = false
bench = false
