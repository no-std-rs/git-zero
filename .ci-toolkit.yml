api_version: ci-toolkit/v1alpha1

# Publish the commit policy independently of repository-program reads.
pull_requests:
  commit_messages:
    format: conventional-commits

releases:
  uses: toolkit.release-please@v1
  with:
    version_file: version.txt
    changelog_path: CHANGELOG.md
    include_component_in_tag: false
    include_v_in_tag: true
    bump_minor_pre_major: true
